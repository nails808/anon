name = "anon-push-api"
main = "worker/index.js"
compatibility_date = "2026-11-23"

[[d1_databases]]
binding = "DB"
database_name = "anon-push"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Set this to the exact HTTPS origin serving the PWA, e.g. https://anon.example.com
APP_ORIGIN = "https://REPLACE_WITH_YOUR_DOMAIN"
